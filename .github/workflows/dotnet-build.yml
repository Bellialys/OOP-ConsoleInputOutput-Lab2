name: .NET build and smoke tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate solution
        run: dotnet sln OOP-ConsoleInputOutput-Lab2.sln list

      - name: Restore
        run: dotnet restore OOP-ConsoleInputOutput-Lab2.sln

      - name: Build
        run: dotnet build OOP-ConsoleInputOutput-Lab2.sln --configuration Release --no-restore --warnaserror

      - name: Smoke test — startup, menu and leap year 2024
        shell: bash
        run: |
          printf '\n1\n2024\n\n0\n' |
            dotnet run --project OOPConsoleInputOutputLab2.csproj --configuration Release --no-build             > smoke-basic.txt

          grep -F "ГОЛОВНЕ МЕНЮ" smoke-basic.txt
          grep -F "1. Перевірка року на високосність" smoke-basic.txt
          grep -F "2024 рік є високосним." smoke-basic.txt
          grep -F "Дякуємо за використання програми!" smoke-basic.txt

      - name: Smoke test — invalid input and leap-year boundary cases
        shell: bash
        run: |
          printf '\nabc\n9\n1\nabc\n0\n-2024\n1900\n\n1\n2000\n\n1\n2025\n\n1\n2100\n\n0\n' |
            dotnet run --project OOPConsoleInputOutputLab2.csproj --configuration Release --no-build             > smoke-validation.txt

          grep -F "Помилка! Введіть ціле число від 0 до 4." smoke-validation.txt
          grep -F "Помилка! Введіть додатний цілий номер року." smoke-validation.txt
          grep -F "1900 рік не є високосним." smoke-validation.txt
          grep -F "2000 рік є високосним." smoke-validation.txt
          grep -F "2025 рік не є високосним." smoke-validation.txt
          grep -F "2100 рік не є високосним." smoke-validation.txt

      - name: Smoke test — triangle task
        shell: bash
        run: |
          printf '\n2\nabc\n0\n-1\n4\n\n0\n' |
            dotnet run --project OOPConsoleInputOutputLab2.csproj --configuration Release --no-build             > smoke-triangle.txt

          grep -F "ЗАВДАННЯ 2. ЧИСЛОВИЙ ТРИКУТНИК" smoke-triangle.txt
          grep -F "Помилка! Введіть додатну цілу висоту трикутника." smoke-triangle.txt
          grep -F "      1" smoke-triangle.txt
          grep -F "    2 2" smoke-triangle.txt
          grep -F "  3 3 3" smoke-triangle.txt
          grep -F "4 4 4 4" smoke-triangle.txt
          grep -F "ГОЛОВНЕ МЕНЮ" smoke-triangle.txt

      - name: Smoke test — millionaire full game
        shell: bash
        run: |
          printf '\n3\n2\n3\n2\n3\n3\n\n0\n' |
            dotnet run --project OOPConsoleInputOutputLab2.csproj --configuration Release --no-build             > smoke-millionaire-win.txt

          grep -F "Питання 1 з 5" smoke-millionaire-win.txt
          grep -F "Синього та жовтого" smoke-millionaire-win.txt
          grep -F "Київ" smoke-millionaire-win.txt
          grep -F "Вітаємо! Ви правильно відповіли на всі 5 питань!" smoke-millionaire-win.txt
          grep -F "Ваш підсумковий рахунок: 500 із 500 балів." smoke-millionaire-win.txt
          grep -F "ГОЛОВНЕ МЕНЮ" smoke-millionaire-win.txt

      - name: Smoke test — millionaire invalid input and wrong answer
        shell: bash
        run: |
          printf '\n3\n7\nabc\n2\n1\n\n0\n' |
            dotnet run --project OOPConsoleInputOutputLab2.csproj --configuration Release --no-build             > smoke-millionaire-loss.txt

          grep -F "Помилка! Введіть ціле число від 1 до 4." smoke-millionaire-loss.txt
          grep -F "Неправильна відповідь!" smoke-millionaire-loss.txt
          grep -F "Ваш підсумковий рахунок: 100 із 500 балів." smoke-millionaire-loss.txt
          grep -F "ГОЛОВНЕ МЕНЮ" smoke-millionaire-loss.txt

      - name: Smoke test — calculator example and precedence
        shell: bash
        run: |
          printf '\n4\n5 + 5 * 10 + 4 / 2 - 3\n\n4\n5+5*10+4/2-3\n\n4\n2 + 3 * 4\n\n4\n8 / 2 * 2\n\n4\n20 - 5 - 3\n\n4\n10,5 + 0,5\n\n0\n' |
            dotnet run --project OOPConsoleInputOutputLab2.csproj --configuration Release --no-build             > smoke-calculator.txt

          test "$(grep -Fc "Результат: 54" smoke-calculator.txt)" -eq 2
          grep -F "Результат: 14" smoke-calculator.txt
          grep -F "Результат: 8" smoke-calculator.txt
          grep -F "Результат: 12" smoke-calculator.txt
          grep -F "Результат: 11" smoke-calculator.txt
          grep -F "ГОЛОВНЕ МЕНЮ" smoke-calculator.txt

      - name: Smoke test — calculator validation
        shell: bash
        run: |
          printf '\n4\n\n5 +\n5 ** 2\nhello\n2 3\n5 / 0\n999999999999999999999999999999999999999999999999999\n10 / 4\n\n0\n' |
            dotnet run --project OOPConsoleInputOutputLab2.csproj --configuration Release --no-build             > smoke-calculator-errors.txt

          grep -F "Помилка! Вираз не може бути порожнім." smoke-calculator-errors.txt
          grep -F "Помилка! Вираз не може закінчуватися оператором." smoke-calculator-errors.txt
          grep -F "Помилка! Очікувалося число." smoke-calculator-errors.txt
          grep -F "Помилка! Невідомий символ: 'h'." smoke-calculator-errors.txt
          grep -F "Помилка! Невідомий символ або пропущений оператор: '3'." smoke-calculator-errors.txt
          grep -F "Помилка! Ділення на нуль неможливе." smoke-calculator-errors.txt
          grep -F "Помилка! Некоректне число або число виходить за допустимий діапазон." smoke-calculator-errors.txt
          grep -F "Результат: 2.5" smoke-calculator-errors.txt
